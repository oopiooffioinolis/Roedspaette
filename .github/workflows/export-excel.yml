# Nightly read-only Excel copies of the vocab sets, attached to the "excel" release.
# Download: https://github.com/<owner>/<repo>/releases/tag/excel
# Nothing is committed, so the repo history doesn't grow with binary files.
name: Excel export

on:
  schedule:
    - cron: "17 3 * * *"   # every night, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: excel-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - run: python tools/export_excel.py exports
      - name: Publish to the "excel" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view excel >/dev/null 2>&1 || \
            gh release create excel --title "Excel export" --notes "Read-only Excel copies of the vocab sets, rebuilt every night. The apps never read these."
          gh release upload excel exports/*.xlsx --clobber
